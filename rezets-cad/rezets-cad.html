<title>Резец CAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: CAD workbench — command bar on top, feature tree / property manager on the left,
   viewport fills the rest, status bar at the bottom. Engineering-blue accent on cool steel neutrals. */
:root {
  --bg: #eef1f5;
  --panel: #f8f9fb;
  --panel-2: #e7ebf1;
  --line: #cfd6df;
  --fg: #1b2330;
  --fg-2: #566173;
  --accent: #1d5bd6;
  --accent-soft: #dbe6fb;
  --warn: #b45309;
  --bad: #c62828;
  --good: #1f7a3a;
  --vp-top: #c9d5e3;
  --vp-bot: #f6f8fb;
  --geo-under: #1d4ed8;
  --geo-full: #11161d;
  --geo-constr: #7189b8;
  --geo-sel: #0891b2;
  --geo-hover: #ea7a17;
  --geo-bad: #d32f2f;
  --geo-ext: #b0368f;
  --dim: #2b3442;
  --body: #b9c3cf;
  --edge: #1f2630;
  --region: #1d5bd6;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181d; --panel: #1b1f25; --panel-2: #232831; --line: #313844; --fg: #e3e8ef; --fg-2: #98a3b3;
    --accent: #5b8ff0; --accent-soft: #24324d; --warn: #f0a24a; --bad: #ef5350; --good: #5cc07a;
    --vp-top: #2b323c; --vp-bot: #171a1f; --geo-under: #6ea2ff; --geo-full: #e8ecf2; --geo-constr: #7f93b8;
    --geo-sel: #38c6e0; --geo-hover: #ffa24d; --geo-bad: #ff6b6b; --geo-ext: #e37fcf; --dim: #c9d2de; --body: #8994a3; --edge: #0d1014; --region: #5b8ff0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181d; --panel: #1b1f25; --panel-2: #232831; --line: #313844; --fg: #e3e8ef; --fg-2: #98a3b3;
  --accent: #5b8ff0; --accent-soft: #24324d; --warn: #f0a24a; --bad: #ef5350; --good: #5cc07a;
  --vp-top: #2b323c; --vp-bot: #171a1f; --geo-under: #6ea2ff; --geo-full: #e8ecf2; --geo-constr: #7f93b8;
  --geo-sel: #38c6e0; --geo-hover: #ffa24d; --geo-bad: #ff6b6b; --geo-ext: #e37fcf; --dim: #c9d2de; --body: #8994a3; --edge: #0d1014; --region: #5b8ff0;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 272px minmax(0, 1fr); grid-template-areas: "top top" "side view" "status status"; }
#top { grid-area: top; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.toprow { display: flex; align-items: center; gap: 8px; padding: 6px 12px; min-width: 0; }
.brand { font-weight: 600; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand svg { width: 20px; height: 20px; color: var(--accent); }
.filebtns { display: flex; gap: 2px; margin-left: 4px; overflow-x: auto; min-width: 0; flex: 0 0 auto; }
.doctabs { display: flex; gap: 2px; margin-left: 12px; overflow-x: auto; min-width: 0; flex: 0 1 auto; }
.doctab { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--fg-2); white-space: nowrap; max-width: 220px; }
.doctab svg { width: 15px; height: 15px; flex: 0 0 15px; }
.doctab span { overflow: hidden; text-overflow: ellipsis; }
.doctab:hover { background: var(--panel-2); color: var(--fg); }
.doctab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); font-weight: 500; }
.inline-val { font: inherit; width: 70px; border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; background: var(--bg); color: var(--fg); }
.doctab input { font: inherit; width: 140px; border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; background: var(--bg); color: var(--fg); }
.addtab { font-size: 16px; line-height: 1; padding: 3px 9px; }
.tbtn { background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--fg-2); white-space: nowrap; }
.tbtn:hover { background: var(--panel-2); color: var(--fg); }
.tbtn:focus-visible, .tool:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 2px; padding: 0 12px; }
.tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; color: var(--fg-2); font-weight: 500; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tools { display: flex; gap: 2px; padding: 6px 12px 8px; overflow-x: auto; min-width: 0; border-top: 1px solid var(--line); }
.tool { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 5px 6px; border-radius: 6px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--fg); font-size: 11.5px; }
.tool svg { width: 22px; height: 22px; }
.tool:hover:not(:disabled) { background: var(--panel-2); }
.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tool:disabled { opacity: .38; cursor: default; }
.tool kbd { font-family: var(--font-num); font-size: 10px; color: var(--fg-2); }
.sep { width: 1px; background: var(--line); margin: 2px 6px; flex: 0 0 1px; }
#side { grid-area: side; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; min-height: 0; }
#view { grid-area: view; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: linear-gradient(var(--vp-top), var(--vp-bot)); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#overlay, #editLayer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#status { grid-area: status; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 16px; align-items: center; padding: 4px 12px; color: var(--fg-2); min-width: 0; overflow: hidden; white-space: nowrap; }
#status .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.pill { border-radius: 999px; padding: 1px 9px; font-weight: 500; font-size: 12px; border: 1px solid currentColor; }
.pill.under { color: var(--geo-under); } .pill.full { color: var(--good); } .pill.over { color: var(--bad); }
#hint { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* Tree */
.sec-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); padding: 10px 12px 4px; display: flex; align-items: center; justify-content: space-between; }
.tree { padding: 2px 6px 12px; }
.row { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 5px; cursor: pointer; user-select: none; position: relative; min-width: 0; }
.row:hover { background: var(--panel-2); }
.row.sel { background: var(--accent-soft); color: var(--accent); }
.row.off { opacity: .45; }
.row.err .nm { color: var(--bad); }
.row.child { padding-left: 26px; }
.row svg { width: 16px; height: 16px; flex: 0 0 16px; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.row .meta { font-family: var(--font-num); font-size: 11px; color: var(--fg-2); }
.row input { font: inherit; width: 100%; border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; background: var(--bg); color: var(--fg); }
.rollbar { height: 6px; margin: 3px 6px; border-radius: 3px; background: var(--accent); cursor: ns-resize; opacity: .85; position: relative; }
.rollbar::after { content: "Откат"; position: absolute; right: 0; top: 7px; font-size: 10px; color: var(--accent); }
.rollbar { margin-bottom: 14px; }
.empty-tree { color: var(--fg-2); padding: 8px 12px; line-height: 1.45; }

/* Property manager */
.pm { padding: 0 0 16px; }
.pm-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
.pm-h svg { width: 18px; height: 18px; color: var(--accent); }
.pm-act { margin-left: auto; display: flex; gap: 4px; }
.ok, .cancel { width: 30px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; display: grid; place-items: center; }
.ok { color: var(--good); } .cancel { color: var(--bad); }
.ok svg, .cancel svg { width: 16px; height: 16px; }
.grp { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
.grp > .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); }
.field { display: flex; align-items: center; gap: 8px; }
.field > span { flex: 0 0 92px; color: var(--fg-2); }
.field input[type=text], .field select { flex: 1; min-width: 0; font-family: var(--font-num); font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); }
.field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; border: none; background: var(--bg); padding: 5px 4px; cursor: pointer; font-size: 12px; color: var(--fg-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.note { color: var(--fg-2); line-height: 1.45; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 12px; color: var(--fg); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.bad { border-color: var(--bad); color: var(--bad); }
.rel { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 5px; }
.rel:hover { background: var(--panel-2); }
.rel .x { margin-left: auto; border: none; background: none; cursor: pointer; color: var(--fg-2); padding: 0 4px; }
.rel .x:hover { color: var(--bad); }
.rel.bad { color: var(--bad); }
#relbar { position: absolute; display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgb(0 0 0 / .16); z-index: 5; }
#relbar button { display: flex; align-items: center; gap: 4px; border: none; background: none; border-radius: 5px; padding: 4px 7px; cursor: pointer; font-size: 12px; color: var(--fg); white-space: nowrap; }
#relbar button:hover { background: var(--accent-soft); color: var(--accent); }
#relbar b { font-size: 13px; min-width: 12px; text-align: center; }
kbd.k { font-family: var(--font-num); font-size: 10px; color: var(--fg-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; margin-left: 2px; }
.measure-main { font-family: var(--font-num); font-size: 22px; font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
.measure-row { display: flex; justify-content: space-between; gap: 8px; color: var(--fg-2); }
.measure-row .num { font-family: var(--font-num); color: var(--fg); font-variant-numeric: tabular-nums; }
.big-btn { padding: 7px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; font-weight: 500; }
.ghost-btn { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
label.chk { display: flex; gap: 8px; align-items: center; cursor: pointer; }

/* Viewport overlays */
.dimlbl { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; font-family: var(--font-num); font-size: 12px; color: var(--dim); background: color-mix(in srgb, var(--vp-bot) 82%, transparent); padding: 0 4px; border-radius: 3px; cursor: pointer; white-space: nowrap; user-select: none; }
.dimlbl.driven { color: var(--fg-2); }
.dimlbl.sel { color: var(--geo-sel); outline: 1px solid var(--geo-sel); }
.dimlbl.bad { color: var(--geo-bad); outline: 1px solid var(--geo-bad); }
#overlay.tooling .glyph, #overlay.tooling .dimlbl { pointer-events: none; }
.kv { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.kv span { color: var(--fg-2); }
.kv b { font-family: var(--font-num); font-weight: 500; text-align: right; }
.pickbox { width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.pickbox.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.glyph { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 3px; display: grid; place-items: center; font-size: 11px; font-weight: 600; line-height: 1; color: var(--fg); background: color-mix(in srgb, var(--vp-bot) 70%, var(--geo-constr) 30%); border: 1px solid var(--geo-constr); cursor: pointer; user-select: none; }
.glyph.sel { border-color: var(--geo-sel); color: var(--geo-sel); }
.glyph.bad { border-color: var(--geo-bad); color: var(--geo-bad); }
.infer { position: absolute; pointer-events: none; font-size: 11px; font-weight: 600; color: var(--geo-hover); transform: translate(12px, 10px); }
.dimedit { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; display: flex; gap: 4px; align-items: center; background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 3px; box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
.dimedit input[type=text] { width: 96px; font-family: var(--font-num); font-size: 13px; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; background: var(--bg); color: var(--fg); }
.dimedit label.chk { gap: 4px; font-size: 12px; color: var(--fg-2); }
.dimedit button { border: none; background: var(--accent); color: #fff; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
.reglbl { position: absolute; transform: translate(-50%, -50%); font-size: 11px; font-family: var(--font-num); color: var(--region); pointer-events: none; }
#corner { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
#corner button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: grid; place-items: center; box-shadow: 0 2px 8px rgb(0 0 0 / .12); }
#corner button svg { width: 22px; height: 22px; }
#corner .ok { color: var(--good); } #corner .cancel { color: var(--bad); }
#viewbar { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; box-shadow: 0 2px 8px rgb(0 0 0 / .1); max-width: calc(100% - 120px); overflow-x: auto; }
#viewbar button { border: none; background: none; padding: 4px 8px; border-radius: 5px; cursor: pointer; color: var(--fg-2); font-size: 12px; white-space: nowrap; }
#viewbar button:hover { background: var(--panel-2); color: var(--fg); }
#toasts { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(560px, calc(100% - 32px)); }
.toast { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px 12px; box-shadow: 0 6px 18px rgb(0 0 0 / .16); display: flex; gap: 10px; align-items: center; line-height: 1.4; width: 100%; }
.toast.warn { border-left-color: var(--warn); } .toast.err { border-left-color: var(--bad); }
.toast .acts { display: flex; gap: 6px; margin-left: auto; }
.toast button { white-space: nowrap; padding: 3px 9px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
#menu { position: fixed; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 22px rgb(0 0 0 / .2); padding: 4px; min-width: 190px; }
#menu button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; }
#menu button:hover { background: var(--accent-soft); }
#menu hr { border: none; border-top: 1px solid var(--line); margin: 4px; }
#modal { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .35); display: grid; place-items: center; padding: 16px; }
.mbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(640px, 100%); max-height: 90%; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.mbox h2 { margin: 0; font-size: 15px; }
.mbox textarea { width: 100%; min-height: 260px; font-family: var(--font-num); font-size: 11.5px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
.mbox .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-2); pointer-events: none; }
#sideToggle { display: none; }
@media (max-width: 760px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "view" "status"; }
  #side { position: absolute; z-index: 20; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); box-shadow: 0 0 24px rgb(0 0 0 / .3); transform: translateX(-102%); transition: transform .2s; }
  #side.open { transform: none; }
  #sideToggle { display: inline-block; }
  .tool { min-width: 54px; }
  .filebtns .wide { display: none; }
  .doctab { max-width: 120px; }
  .toprow { gap: 4px; padding: 6px 8px; }
  .brand { font-size: 0; gap: 0; }
  .doctabs { flex: 1 1 0; margin-left: 4px; }
  .filebtns { display: none; }
  #viewbar { top: auto; bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) { #side { transition: none; } }
</style>

<div id="app">
  <header id="top">
    <div class="toprow">
      <button class="tbtn" id="sideToggle" aria-label="Дерево построения">☰</button>
      <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20 14 10M14 10l3-6 3 3-6 3M4 20l3-1-2-2z"/></svg>Резец CAD</div>
      <div class="doctabs" id="docTabs" role="tablist" aria-label="Документы проекта"></div>
      <button class="tbtn addtab" id="bAdd" title="Новый документ или импорт" aria-label="Добавить документ">＋</button>
      <div class="filebtns">
        <button class="tbtn" id="bImport">Открыть…</button>
        <button class="tbtn" id="bExport">Сохранить…</button>
        <button class="tbtn wide" id="bStl">STL…</button>
      </div>
      <div class="spacer"></div>
      <button class="tbtn" id="bUndo" title="Отменить (Ctrl+Z)">↶</button>
      <button class="tbtn" id="bRedo" title="Повторить (Ctrl+Y)">↷</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabFeat" aria-selected="true">Элементы</button>
      <button class="tab" role="tab" id="tabSketch" aria-selected="false">Эскиз</button>
    </div>
    <div class="tools" id="tools"></div>
  </header>
  <aside id="side"></aside>
  <main id="view">
    <canvas id="cv"></canvas>
    <div id="overlay"></div>
    <div id="editLayer"></div>
    <div id="relbar" hidden></div>
    <div id="viewbar">
      <button data-view="front">Спереди</button><button data-view="top">Сверху</button><button data-view="right">Справа</button><button data-view="iso">Изометрия</button><button data-view="normal">Перпендикулярно</button><button data-view="fit">Вписать (F)</button>
    </div>
    <div id="corner"></div>
    <div id="toasts"></div>
    <div id="loading">Загрузка геометрического ядра…</div>
  </main>
  <footer id="status"><span id="stState"></span><span id="hint"></span><span class="spacer"></span><span class="num" id="stXY"></span><span>мм</span></footer>
</div>
<div id="menu" hidden></div>
<div id="modal" hidden><div class="mbox"><h2 id="mTitle"></h2><div class="note" id="mNote"></div><textarea id="mText" spellcheck="false"></textarea><div class="acts" id="mActs"></div></div></div>
<input type="file" id="fileIn" accept=".json,.rezets,application/json" hidden>
<input type="file" id="stepIn" accept=".step,.stp,.STEP,.STP" hidden>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/src/index.js",
  "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/src/index.js"
} }
</script>
<script type="module">

window.addEventListener('keydown', (e) => {
  const tag = e.target.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const k = e.code && e.code.startsWith('Key') ? e.code.slice(3).toLowerCase() : e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') {
    // Esc never leaves the sketch: it ends the current tool action, then clears the selection.
    if (!$('modal').hidden) return closeModal();
    if (!menu.hidden) return closeMenu();
    if (S.editing && S.skOp) { cancelSkOp(); return; }
    if (S.editing) { if (S.draw || S.dimPick) { S.dimPick = null; S.dimPreview = null; endDrawing(); refreshSketch(); } else if (S.tool !== 'select') setTool('select'); else { S.sel.clear(); S.conflict = new Set(); refreshSketch(); } return; }
    if (S.measure) return closeMeasure();
    if (S.pm) return closePM();
    if (S.mode === 'asm') { S.asmSel = null; asmRefresh(); return; }
    S.selectedTree = null; buildPlanes(); renderTree(); requestRender(); return;
  }
  if (e.key === 'Enter' && S.pm) { okPM(); return; }
  if (S.mode === 'asm') {
    if (k === 'f') return fitView();
    if (k === 'i') return cmdInsert();
    if (k === 'm') return S.pm?.kind === 'mate' ? closePM() : cmdMate();
    if (e.key === 'Delete' && S.asmSel) { const c = S.doc.comps.find((x) => x.id === S.asmSel); if (c) asmDeleteComp(c); }
    return;
  }
  if (S.mode === 'import') { if (k === 'f') return fitView(); if (k === 'm') return S.measure ? closeMeasure() : cmdMeasure(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.editing) { e.preventDefault(); deleteSelection(); return; }
  if (e.key === 'Delete' && S.selectedTree?.startsWith('feat:')) { deleteFeature(featById(S.selectedTree.slice(5))); return; }
  if (k === 'f') return fitView();
  // With something selected, letters add relations (shown on the relation bar); otherwise they pick tools.
  if (S.editing && S.sel.size && S.tool === 'select') { const opt = relationOptions(editSk()).find(([t]) => REL_KEYS[t] === k.toUpperCase()); if (opt) { e.preventDefault(); applyRelation(opt[2]); return; } }
  if (S.editing) { const map = { l: 'line', r: 'rect', c: 'circle', a: 'arc', p: 'point', d: 'dim', s: 'select', t: 'trim' }; if (map[k]) { setTool(map[k]); return; } if (k === 'g') return toggleConstruction(); }
  else { if (k === 'm') return S.measure ? closeMeasure() : cmdMeasure(); if (k === 's') return cmdSketch(); if (k === 'e') return cmdFeature('extrude', 'add'); if (k === 'x') return cmdFeature('extrude', 'cut'); }
});
